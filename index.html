<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 문화 지도 🌍 World Culture Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--catholic:#4a90d9;--protestant:#6ec6ff;--orthodox:#1e3a5f;
--sunni:#2ecc71;--shia:#1a8a4a;--ibadi:#0d6b3a;
--buddhism:#f1c40f;--hinduism:#e67e22;--judaism:#9b59b6;
--none:#95a5a6;--traditional:#e74c3c;--other:#7f8c8d;
--bg:#0a0a14;--surface:#0f0f1e;--surface2:#161628;--border:rgba(255,255,255,.08)
}
body{background:var(--bg);color:#e0e0e0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:8px 16px 2px;flex-shrink:0;position:relative}
header h1{font-size:clamp(14px,3vw,22px);font-weight:600;letter-spacing:1px}

/* Tabs */
#tabs{display:flex;justify-content:center;gap:2px;padding:4px 10px 0;flex-shrink:0;flex-wrap:wrap}
.tab-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-bottom:none;border-radius:8px 8px 0 0;padding:6px 14px;font-size:12px;color:#888;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab-btn:hover{background:rgba(255,255,255,.08);color:#ccc}
.tab-btn.active{background:var(--surface);color:#fff;border-color:rgba(255,255,255,.12)}
.tab-icon{font-size:14px}

#main{flex:1;display:flex;overflow:hidden;position:relative}
#map-container{flex:1;position:relative;overflow:hidden}
svg#map{width:100%;height:100%;display:block}
.country{stroke:#1a1a2e;stroke-width:.4px;cursor:pointer;transition:opacity .15s}
.country:hover{opacity:.8;stroke:#fff;stroke-width:1.2px}
.country.selected{stroke:#fff;stroke-width:2px;filter:brightness(1.3)}

#tooltip{position:absolute;pointer-events:none;background:rgba(10,10,20,.95);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;display:none;max-width:320px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:10}
.tt-name{font-size:15px;font-weight:600;margin-bottom:4px}
.tt-religion{color:#bbb;font-size:12px}
.tt-bar{height:6px;border-radius:3px;margin:2px 0;background:#222}
.tt-bar-fill{height:100%;border-radius:3px}
.tt-dish{margin:3px 0;font-size:12px;color:#ccc}
.tt-dish-name{font-weight:600;color:#fff}
.tt-greeting{font-size:16px;margin:4px 0;color:#f1c40f}
.tt-info{font-size:12px;color:#bbb;margin:2px 0}
.tt-label{color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.5px}

#legend{position:absolute;bottom:12px;left:12px;background:rgba(10,10,20,.9);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:11px;backdrop-filter:blur(12px);z-index:5;max-height:calc(100vh - 140px);overflow-y:auto}
#legend h3{font-size:12px;margin-bottom:8px;color:#888;font-weight:500}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0;white-space:nowrap}
.legend-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.legend-color{width:20px;height:10px;border-radius:3px;flex-shrink:0}

#stats-sidebar{width:280px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:0}
#stats-sidebar.collapsed{width:0;border:none;overflow:hidden}
#stats-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;background:var(--surface);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:8px 4px;cursor:pointer;color:#888;font-size:14px;transition:all .2s}
#stats-toggle:hover{color:#fff;background:var(--surface2)}
.stats-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.stats-section h3{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.stats-section h4{font-size:11px;color:#555;margin:10px 0 6px;font-weight:500}
.global-bar{margin:5px 0}
.global-bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;align-items:center}
.global-bar-label .gb-icon{font-size:13px}
.global-bar-track{height:10px;background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden;position:relative}
.global-bar-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.global-bar-pct{font-variant-numeric:tabular-nums;color:#888}

.continent-chart{margin:4px 0}
.continent-row{margin:6px 0}
.continent-name{font-size:10px;color:#888;margin-bottom:2px;font-weight:600}
.continent-stack{height:14px;border-radius:4px;overflow:hidden;display:flex;position:relative}
.continent-seg{height:100%;transition:width .8s;min-width:1px}

#panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
#panel-overlay.open{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;width:440px;max-width:100vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:51;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
#panel-close{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 14px;background:linear-gradient(var(--surface),transparent)}
#panel-close button{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#888;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
#panel-close button:hover{background:rgba(255,255,255,.12);color:#fff}
.panel-header{padding:0 24px 20px;text-align:center}
.panel-flag{font-size:56px;line-height:1;margin-bottom:4px}
.panel-country{font-size:24px;font-weight:700}
.panel-country-en{font-size:13px;color:#666;margin-top:2px}
.panel-section{padding:18px 24px;border-top:1px solid var(--border)}
.panel-section h3{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.info-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.info-value{font-size:13px;font-weight:500}

.panel-donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.panel-donut-svg{flex-shrink:0}
.panel-donut-legend{flex:1;font-size:12px}
.pdl-item{display:flex;align-items:center;gap:6px;margin:4px 0}
.pdl-icon{font-size:14px;width:18px;text-align:center}
.pdl-color{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pdl-pct{color:#777;margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}

.p-hbar{margin:5px 0}
.p-hbar-label{font-size:11px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.p-hbar-icon{font-size:13px}
.p-hbar-track{height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.p-hbar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

.religion-desc{font-size:12px;color:#999;line-height:1.6;margin-top:10px;padding:12px 14px;background:rgba(255,255,255,.02);border-radius:10px;border-left:3px solid #444}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;margin:3px 3px 3px 0}
.tag-free{background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.25)}
.tag-partial{background:rgba(241,196,15,.12);color:#f1c40f;border:1px solid rgba(241,196,15,.25)}
.tag-restricted{background:rgba(231,76,60,.12);color:#e74c3c;border:1px solid rgba(231,76,60,.25)}
.tag-state{background:rgba(74,144,217,.12);color:#4a90d9;border:1px solid rgba(74,144,217,.25)}

/* Food/Movie/Politics panel cards */
.dish-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;margin:8px 0}
.dish-name{font-size:14px;font-weight:600;margin-bottom:4px}
.dish-name-en{font-size:11px;color:#666}
.dish-desc{font-size:12px;color:#999;margin-top:4px}
.dish-flavor{display:inline-block;font-size:10px;color:#f1c40f;background:rgba(241,196,15,.1);padding:2px 8px;border-radius:8px;margin-top:4px}
.movie-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;margin:8px 0}
.movie-title{font-size:14px;font-weight:600}
.movie-title-en{font-size:11px;color:#666}
.movie-meta{font-size:11px;color:#888;margin-top:4px}
.party-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin:3px 3px 3px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.lang-greeting{font-size:24px;text-align:center;margin:12px 0;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.lang-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lang-tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;background:rgba(52,152,219,.1);border:1px solid rgba(52,152,219,.2);color:#5dade2}

footer{text-align:center;padding:5px;font-size:10px;color:#444;flex-shrink:0}

/* ── Full-page country view ── */
#country-page{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;transform:translateY(100%);opacity:0;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .4s;pointer-events:none;scroll-behavior:smooth}
#country-page.open{transform:translateY(0);opacity:1;pointer-events:auto}
#country-page-close{position:fixed;top:16px;right:16px;z-index:101;background:rgba(15,15,30,.9);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:all .2s}
#country-page-close:hover{background:rgba(255,255,255,.15);transform:scale(1.1)}
#country-page.open~#country-page-close{display:flex}
.cp-header{text-align:center;padding:40px 20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(74,144,217,.08),transparent)}
.cp-flag{font-size:72px;line-height:1;margin-bottom:8px}
.cp-name{font-size:32px;font-weight:700}
.cp-name-en{font-size:15px;color:#666;margin-top:4px}
.cp-basic-info{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:16px}
.cp-basic-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 16px;text-align:center}
.cp-basic-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.5px}
.cp-basic-value{font-size:14px;font-weight:500;margin-top:2px}
.cp-nav{position:sticky;top:0;z-index:10;background:rgba(10,10,20,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:4px;padding:10px 16px;flex-wrap:wrap}
.cp-nav-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 14px;font-size:12px;color:#888;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.cp-nav-btn:hover{background:rgba(255,255,255,.08);color:#ccc}
.cp-nav-btn.active{background:rgba(74,144,217,.2);color:#fff;border-color:rgba(74,144,217,.4)}
.cp-content{max-width:900px;margin:0 auto;padding:0 16px 60px}
.cp-section{padding:32px 0;border-bottom:1px solid var(--border)}
.cp-section:last-child{border-bottom:none}
.cp-section-title{font-size:18px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.cp-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cp-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px;transition:all .2s}
.cp-card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.cp-card-title{font-size:15px;font-weight:600;margin-bottom:4px}
.cp-card-sub{font-size:11px;color:#666}
.cp-card-desc{font-size:12px;color:#999;margin-top:6px;line-height:1.5}
.cp-card-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;margin-top:6px;background:rgba(241,196,15,.1);color:#f1c40f}
.cp-donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.cp-region-map{width:100%;max-width:600px;margin:0 auto;position:relative;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden}
.cp-region-map svg{width:100%;display:block}
.cp-region-marker{cursor:pointer;transition:all .2s}
.cp-region-marker:hover{filter:brightness(1.5)}
.cp-region-tooltip{position:absolute;background:rgba(10,10,20,.95);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;font-size:12px;pointer-events:none;display:none;z-index:5;max-width:200px;backdrop-filter:blur(10px)}
.cp-info-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cp-info-row:last-child{border-bottom:none}

@media(max-width:600px){
  .cp-header{padding:24px 12px 16px}
  .cp-flag{font-size:48px}
  .cp-name{font-size:24px}
  .cp-content{padding:0 12px 40px}
  .cp-cards-grid{grid-template-columns:1fr}
  .cp-nav-btn{padding:4px 10px;font-size:11px}
  #country-page-close{top:10px;right:10px;width:36px;height:36px;font-size:16px}
}

#lang-switcher{position:absolute;top:6px;left:16px;z-index:10;display:flex;gap:4px}
#lang-switcher button{background:rgba(15,15,30,.9);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:4px 8px;font-size:16px;cursor:pointer;transition:all .2s;color:#e0e0e0}
#lang-switcher button:hover{background:rgba(30,30,60,.9);border-color:rgba(255,255,255,.2)}
#lang-switcher button.active{background:rgba(74,144,217,.3);border-color:rgba(74,144,217,.5)}

@media(max-width:900px){
  #stats-sidebar{display:none}
  #stats-toggle{display:none}
}
@media(max-width:600px){
  #legend{bottom:8px;left:6px;padding:8px 10px;font-size:9px;max-width:130px}
  .legend-icon{font-size:11px;width:14px}
  .legend-color{width:14px;height:8px}
  #tooltip{font-size:11px;max-width:200px}
  #panel{width:100vw;border-left:none}
  .panel-header{padding:0 16px 16px}
  .panel-section{padding:14px 16px}
  .tab-btn{padding:4px 8px;font-size:10px}
  .tab-icon{font-size:12px}
  #tabs{gap:1px;padding:2px 4px 0}
}
.pub-sources{font-size:11px;color:#777;margin-top:10px;line-height:1.7}
.pub-sources a{color:#8ab4f8;text-decoration:none}
.pub-sources a:hover{text-decoration:underline}
.pub-value{font-size:12px;font-weight:400;line-height:1.5;color:#ddd}
</style>
</head>
<body>
<header>
<div id="lang-switcher"><button data-lang="ko" class="active">🇰🇷</button><button data-lang="en">🇬🇧</button><button data-lang="ja">🇯🇵</button></div>
<h1 data-i18n="title">세계 문화 지도 🌍</h1>
<a href="globe.html" data-i18n="globe3d" style="position:absolute;top:8px;right:16px;z-index:10;background:rgba(15,15,30,.9);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 12px;color:#e0e0e0;font-size:12px;cursor:pointer;backdrop-filter:blur(10px);text-decoration:none;display:inline-flex;align-items:center;gap:4px">🌐 3D 지구본</a>
</header>

<div id="tabs">
  <button class="tab-btn active" data-tab="religion" onclick="switchTab('religion')"><span class="tab-icon">🕊️</span><span data-i18n="tab_religion">종교</span></button>
  <button class="tab-btn" data-tab="food" onclick="switchTab('food')"><span class="tab-icon">🍽️</span><span data-i18n="tab_food">음식</span></button>
  <button class="tab-btn" data-tab="politics" onclick="switchTab('politics')"><span class="tab-icon">🏛️</span><span data-i18n="tab_politics">정치</span></button>
  <button class="tab-btn" data-tab="movies" onclick="switchTab('movies')"><span class="tab-icon">🎬</span><span data-i18n="tab_movies">영화</span></button>
  <button class="tab-btn" data-tab="languages" onclick="switchTab('languages')"><span class="tab-icon">🗣️</span><span data-i18n="tab_languages">언어</span></button>
  <button class="tab-btn" data-tab="business" onclick="switchTab('business')"><span class="tab-icon">🏢</span><span data-i18n="tab_business">기업</span></button>
</div>

<div id="main">
<div id="map-container">
  <svg id="map">
    <defs>
      <pattern id="pat-stripe-catholic" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="var(--catholic)"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
      </pattern>
      <pattern id="pat-stripe-protestant" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
        <rect width="6" height="6" fill="var(--protestant)"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
      </pattern>
      <pattern id="pat-stripe-orthodox" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
        <rect width="6" height="6" fill="var(--orthodox)"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
      </pattern>
      <linearGradient id="grad-sunni" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#27ae60"/><stop offset="100%" stop-color="#2ecc71"/>
      </linearGradient>
      <linearGradient id="grad-shia" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#145a32"/><stop offset="100%" stop-color="#1a8a4a"/>
      </linearGradient>
      <linearGradient id="grad-buddhism" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d4ac0d"/><stop offset="100%" stop-color="#f1c40f"/>
      </linearGradient>
      <linearGradient id="grad-hinduism" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ca6f1e"/><stop offset="100%" stop-color="#e67e22"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="tooltip"></div>
  <div id="legend"></div>
  <button id="stats-toggle" onclick="toggleStats()">📊</button>
</div>
<div id="stats-sidebar"></div>
</div>
<div id="panel-overlay" onclick="closePanel()"></div>
<div id="panel"><div id="panel-close"><button onclick="closePanel()">✕</button></div><div id="panel-content"></div></div>
<div id="country-page"></div>
<button id="country-page-close" onclick="closeCountryPage()">✕</button>
<footer data-i18n="footer">World Culture Map | Data: Various Sources | © 2024</footer>

<script src="data-food.js"></script>
<script src="data-politics.js"></script>
<script src="data-movies.js"></script>
<script src="data-languages.js"></script>
<script src="data-business.js"></script>
<script src="data-regions.js"></script>
<script>
// ── Current tab ──
let currentTab = 'religion';

// ── i18n ──
const i18n={
  ko:{
    title:"세계 문화 지도 🌍",globe3d:"🌐 3D 지구본",
    tab_religion:"종교",tab_food:"음식",tab_politics:"정치",tab_movies:"영화",tab_languages:"언어",
    legendTitle:"종교 범례",globalStats:"🌐 전 세계 종교 분포",continentStats:"🗺️ 대륙별 종교 분포",
    globalNote:"세계 인구 약 80억 명 기준 (Pew 2020)",

// ── Legend builder (per tab) ──
function buildLegend(){
  const leg=document.getElementById('legend');
  if(currentTab==='religion'){
    leg.innerHTML='<h3>'+t('legendTitle')+'</h3>'+Object.entries(RELIGIONS).map(([k,v])=>
      `<div class="legend-item"><span class="legend-icon">${v.icon}</span><div class="legend-color" style="background:${v.c}"></div>${rn(k)}</div>`
    ).join('');
  } else if(currentTab==='food'){
    leg.innerHTML='<h3>'+t('food_legendTitle')+'</h3>'+Object.entries(FOOD_REGIONS).map(([k,v])=>{
      const label = currentLang==='en'? k : k;
      return `<div class="legend-item"><div class="legend-color" style="background:${v.c}"></div>${label}</div>`;
    }).join('');
  } else if(currentTab==='politics'){
    leg.innerHTML='<h3>'+t('pol_legendTitle')+'</h3>'+Object.entries(GOV_TYPES).map(([k,v])=>{
      const label = currentLang==='ko'?k:(currentLang==='ja'?v.ja:v.en);
      return `<div class="legend-item"><span class="legend-icon">${v.icon}</span><div class="legend-color" style="background:${v.c}"></div>${label}</div>`;
    }).join('');
  } else if(currentTab==='movies'){
    leg.innerHTML='<h3>'+t('mov_legendTitle')+'</h3>'+Object.entries(MOVIE_INDUSTRY).map(([k,v])=>{
      const label = currentLang==='ko'?k:(currentLang==='ja'?v.ja:v.en);
      return `<div class="legend-item"><div class="legend-color" style="background:${v.c}"></div>${label}</div>`;
    }).join('');
  } else if(currentTab==='languages'){
    leg.innerHTML='<h3>'+t('lang_legendTitle')+'</h3>'+Object.entries(LANG_FAMILIES).filter(([k])=>['인도유럽어족','시노티베탄어족','아프로아시아어족','니제르콩고어족','오스트로네시아어족','튀르크어족','우랄어족','타이카다이어족','한국어족','일본어족'].includes(k)).map(([k,v])=>{
      const label = currentLang==='ko'?k:(currentLang==='ja'?v.ja:v.en);
      return `<div class="legend-item"><span class="legend-icon">${v.icon}</span><div class="legend-color" style="background:${v.c}"></div>${label}</div>`;
    }).join('');
  } else if(currentTab==='business'){
    leg.innerHTML='<h3>'+t('biz_legendTitle')+'</h3>'+Object.entries(BIZ_INDUSTRIES).map(([k,v])=>{
      const label = currentLang==='ko'?k:(currentLang==='ja'?v.ja:v.en);
      return `<div class="legend-item"><span class="legend-icon">${v.icon}</span><div class="legend-color" style="background:${v.c}"></div>${label}</div>`;
    }).join('');
  }
}

  let html='';

    html+=`<div class="global-bar">

      <div class="global-bar-track"><div class="global-bar-fill" style="width:${s.p*100/31.1}%;background:${s.c}"></div></div>`;

      html+='<div style="padding-left:22px;margin-top:2px">';
      s.sub.forEach(ss=>{
        html+=`<div style="font-size:10px;color:#666;display:flex;justify-content:space-between;margin:1px 0"><span>└ ${gn(ss.n)}</span><span>${ss.p}%</span></div>`;

function animateBars(container){
  setTimeout(()=>{
    container.querySelectorAll('.global-bar-fill').forEach(el=>{
      const w=el.style.width; el.style.width='0';
      requestAnimationFrame(()=>el.style.width=w);
    });
  },100);
}

// ── Map fill per tab ──
function getMapFill(iso){
  if(currentTab==='religion'){
    const d=DATA[iso];
    if(!d||!d.r||!d.r.length)return '#222';
    const rm=RELIGIONS[d.r[0].n];
    return rm?rm.fill||rm.c:'#222';
  } else if(currentTab==='food'){
    const fr=getFoodRegion(iso);
    return fr?fr.color:'#1a1a2e';
  } else if(currentTab==='politics'){
    const pd=POLITICS_DATA[iso];
    if(!pd)return '#1a1a2e';
    const gt=GOV_TYPES[pd.gov];
    return gt?gt.c:'#1a1a2e';
  } else if(currentTab==='movies'){
    const md=MOVIES_DATA[iso];
    if(!md)return '#1a1a2e';
    const mi=MOVIE_INDUSTRY[md.industry];
    return mi?mi.c:'#1a1a2e';
  } else if(currentTab==='languages'){
    const ld=LANGUAGES_DATA[iso];
    if(!ld)return '#1a1a2e';
    const lf=LANG_FAMILIES[ld.family];
    return lf?lf.c:'#1a1a2e';
  } else if(currentTab==='business'){
    const bd=BUSINESS_DATA[iso];
    if(!bd)return '#1a1a2e';
    const bi=BIZ_INDUSTRIES[bd.industry];
    return bi?bi.c:'#1a1a2e';
  }
  return '#222';
}

// ── Tooltip per tab ──
function buildTooltipHTML(iso){
  if(currentTab==='religion'){
    const info=DATA[iso];
    if(!info)return null;
    let html=`<div class="tt-name">${info.n}</div>`;
    info.r.forEach(r=>{const rm=rc(r.n);
      html+=`<div class="tt-religion"><span style="color:${rm.c}">${rm.icon}</span> ${rn(r.n)}: ${r.p}%</div>`;
      html+=`<div class="tt-bar"><div class="tt-bar-fill" style="width:${r.p}%;background:${rm.c}"></div></div>`;
    });
    return html;
  } else if(currentTab==='food'){
    const fd=FOOD_DATA[iso];
    if(!fd)return null;
    const name=currentLang==='en'?fd.en:(currentLang==='ja'?(fd.ja||fd.n):fd.n);
    let html=`<div class="tt-name">${fd.f} ${name}</div>`;
    fd.dishes.slice(0,3).forEach(d=>{
      const dn=currentLang==='en'?d.en:(currentLang==='ja'?d.ja:d.ko);
      html+=`<div class="tt-dish"><span class="tt-dish-name">${dn}</span><br><span style="color:#888;font-size:11px">${d.flavor}</span></div>`;
    });
    if(fd.dishes.length>3) html+=`<div style="color:#666;font-size:11px">+${fd.dishes.length-3} more...</div>`;
    return html;
  } else if(currentTab==='politics'){
    const pd=POLITICS_DATA[iso];
    if(!pd)return null;
    const gt=GOV_TYPES[pd.gov]||{icon:'🏛️',c:'#666'};
    const govLabel=currentLang==='ko'?pd.gov:(currentLang==='ja'?(gt.ja||pd.gov):(gt.en||pd.gov));
    let html=`<div class="tt-name">${pd.f} ${currentLang==='en'?pd.en:pd.n}</div>`;
    html+=`<div class="tt-info">${gt.icon} <strong>${govLabel}</strong></div>`;
    html+=`<div class="tt-info" style="color:#aaa">${pd.leader}</div>`;
    return html;
  } else if(currentTab==='movies'){
    const md=MOVIES_DATA[iso];
    if(!md)return null;
    let html=`<div class="tt-name">${md.f} ${currentLang==='en'?md.en:md.n}</div>`;
    const mi=MOVIE_INDUSTRY[md.industry]||{};
    const indLabel=currentLang==='ko'?md.industry:(currentLang==='ja'?(mi.ja||md.industry):(mi.en||md.industry));
    html+=`<div class="tt-info">🎬 ${indLabel}</div>`;
    md.movies.slice(0,2).forEach(m=>{
      const mn=currentLang==='en'?m.en:(currentLang==='ja'?m.ja:m.ko);
      html+=`<div class="tt-dish"><span class="tt-dish-name">${mn}</span> <span style="color:#888">(${m.year})</span></div>`;
    });
    return html;
  } else if(currentTab==='languages'){
    const ld=LANGUAGES_DATA[iso];
    if(!ld)return null;
    let html=`<div class="tt-name">${ld.f} ${currentLang==='en'?ld.en:ld.n}</div>`;
    html+=`<div class="tt-greeting">${ld.greeting}</div>`;
    const famLabel=currentLang==='ko'?ld.family:(currentLang==='ja'?(LANG_FAMILIES[ld.family]?.ja||ld.family):(LANG_FAMILIES[ld.family]?.en||ld.family));
    html+=`<div class="tt-info">${LANG_FAMILIES[ld.family]?.icon||'🌐'} ${famLabel}</div>`;
    html+=`<div class="tt-info" style="color:#aaa">${ld.official}</div>`;
    return html;
  } else if(currentTab==='business'){
    const bd=BUSINESS_DATA[iso];
    if(!bd)return null;
    const bi=BIZ_INDUSTRIES[bd.industry]||{icon:'🏢',c:'#666'};
    const indLabel=currentLang==='ko'?bd.industry:(currentLang==='ja'?(bi.ja||bd.industry):(bi.en||bd.industry));
    let html=`<div class="tt-name">${bd.f} ${currentLang==='en'?bd.en:bd.n}</div>`;
    html+=`<div class="tt-info">${bi.icon} ${indLabel}</div>`;
    bd.companies.slice(0,2).forEach(c=>{
      const cn=currentLang==='en'?c.en:(currentLang==='ja'?c.ja:c.ko);
      html+=`<div class="tt-dish"><span class="tt-dish-name">${cn}</span></div>`;
    });
    return html;
  }
  return null;
}

// ── Unified Panel ──
function openPanel(iso,el){
  openUnifiedPanel(iso,el);
}

let panelActiveTab = 'overview';

function openUnifiedPanel(iso,el){
  // Check if any data exists
  const pub = PUBLIC_BY_ISO3[iso];
  const hasAny = DATA[iso] || FOOD_DATA[iso] || POLITICS_DATA[iso] || MOVIES_DATA[iso] || LANGUAGES_DATA[iso] || BUSINESS_DATA[iso] || PROFILE[iso] || pub;
  if(!hasAny) return;
  showPanel(el);
  
  const prof = PROFILE[iso];
  const info = DATA[iso];
  const fd = FOOD_DATA[iso];
  const pd = POLITICS_DATA[iso];
  const md = MOVIES_DATA[iso];
  const ld = LANGUAGES_DATA[iso];
  const bd = BUSINESS_DATA[iso];
  
  // Determine name and flag
  const flag = prof?.f || fd?.f || pd?.f || md?.f || ld?.f || bd?.f || pub?.flag || '🏳️';
  const name = prof ? (currentLang==='en'? prof.e : info?.n || pd?.n || fd?.n || '?') : (info?.n || fd?.n || pd?.n || md?.n || ld?.n || bd?.n || pubLabel(pub?.name) || '?');
  const enName = prof?.e || fd?.en || pd?.en || md?.en || ld?.en || bd?.en || pub?.name?.en || '';
  
  // Build tab list
  const tabs = [];
  tabs.push({id:'overview',icon:'📊',label:{ko:'기본 정보',en:'Overview',ja:'基本情報'}});
  if(info) tabs.push({id:'religion',icon:'🙏',label:{ko:'종교',en:'Religion',ja:'宗教'}});
  if(pd) tabs.push({id:'politics',icon:'🏛️',label:{ko:'정치',en:'Politics',ja:'政治'}});
  if(fd) tabs.push({id:'food',icon:'🍜',label:{ko:'음식',en:'Food',ja:'料理'}});
  if(md) tabs.push({id:'movies',icon:'🎬',label:{ko:'영화',en:'Movies',ja:'映画'}});
  if(bd) tabs.push({id:'business',icon:'💼',label:{ko:'비즈니스',en:'Business',ja:'ビジネス'}});
  if(ld) tabs.push({id:'languages',icon:'🗣️',label:{ko:'언어',en:'Language',ja:'言語'}});
  
  panelActiveTab = 'overview';
  
  let html = panelHeader(flag, currentLang==='en'?enName:name, currentLang==='en'?'':enName);
  
  // Panel tabs
  html += `<div style="display:flex;flex-wrap:wrap;gap:2px;padding:8px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:3">`;
  tabs.forEach(tab => {
    const label = tab.label[currentLang] || tab.label.en;
    html += `<button class="panel-tab-btn${tab.id==='overview'?' active':''}" data-ptab="${tab.id}" onclick="switchPanelTab('${iso}','${tab.id}',this)" style="background:${tab.id==='overview'?'rgba(255,255,255,.1)':'rgba(255,255,255,.04)'};border:1px solid ${tab.id==='overview'?'rgba(255,255,255,.15)':'rgba(255,255,255,.06)'};border-radius:8px;padding:5px 10px;font-size:11px;color:${tab.id==='overview'?'#fff':'#888'};cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;transition:all .2s">${tab.icon} ${label}</button>`;
  });
  html += `</div>`;
  
  html += `<div id="panel-tab-content">`;
  html += buildPanelOverview(iso);
  html += `</div>`;
  
  panelContent.innerHTML = html;
}

function switchPanelTab(iso, tabId, btn){
  panelActiveTab = tabId;
  document.querySelectorAll('.panel-tab-btn').forEach(b => {
    b.style.background = 'rgba(255,255,255,.04)';

function buildPanelReligion(iso){

  const rf=prof?rfMap[prof.rf]||rfMap.free:rfMap.free;
  const sorted=[...info.r].sort((a,b)=>b.p-a.p);
  const donutSvg=buildDonutSVG(sorted,140,56,36);
  const donutLegend=sorted.map(rel=>{
    const rm=rc(rel.n);

  }).join('');

    <div class="panel-donut-wrap">${donutSvg}<div class="panel-donut-legend">${donutLegend}</div></div>${bars}</div>`;

function buildDonutSVG(rels,size,outerR,innerR){
  let cum=-Math.PI/2, arcs='';
  rels.forEach(rel=>{
    const angle=(rel.p/100)*2*Math.PI;
    if(angle<0.01)return;
    const x1=Math.cos(cum)*outerR,y1=Math.sin(cum)*outerR;
    const ea=cum+angle;
    const x2=Math.cos(ea)*outerR,y2=Math.sin(ea)*outerR;
    const ix1=Math.cos(cum)*innerR,iy1=Math.sin(cum)*innerR;
    const ix2=Math.cos(ea)*innerR,iy2=Math.sin(ea)*innerR;
    const lg=angle>Math.PI?1:0;
    const col=rc(rel.n).c;
    arcs+=`<path d="M${ix1},${iy1} L${x1},${y1} A${outerR},${outerR} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${innerR},${innerR} 0 ${lg} 0 ${ix1},${iy1}" fill="${col}" stroke="#0f0f1e" stroke-width="1.5">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze"/>
    </path>`;
    cum=ea;
  });
  const pad=outerR+6;
  const majorIcon=rc(rels[0].n).icon;
  return `<svg class="panel-donut-svg" width="${size}" height="${size}" viewBox="-${pad} -${pad} ${pad*2} ${pad*2}">
    ${arcs}<text x="0" y="6" text-anchor="middle" font-size="24">${majorIcon}</text></svg>`;
}

  if(currentTab==='religion'){
    const info=DATA[iso];
    return info?rc(info.r[0].n).c:'#444';
  }
  if(currentTab==='food'){
    const fr=getFoodRegion(iso);
    return fr?fr.color:'#444';
  }
  if(currentTab==='politics'){
    const pd=POLITICS_DATA[iso];
    if(!pd)return '#444';
    return (GOV_TYPES[pd.gov]||{c:'#444'}).c;
  }
  if(currentTab==='movies'){
    const md=MOVIES_DATA[iso];
    if(!md)return '#444';
    return (MOVIE_INDUSTRY[md.industry]||{c:'#444'}).c;
  }
  if(currentTab==='languages'){
    const ld=LANGUAGES_DATA[iso];
    if(!ld)return '#444';
    return (LANG_FAMILIES[ld.family]||{c:'#444'}).c;
  }
  if(currentTab==='business'){
    const bd=BUSINESS_DATA[iso];
    if(!bd)return '#444';
    return (BIZ_INDUSTRIES[bd.industry]||{c:'#444'}).c;
  }
  return '#444';
}

// Built by data/build_public.py. Loaded with fetch, so it is skipped silently on file://;
// everything below falls back to the hand-curated tables when it is absent.
const PUBLIC_BY_ISO3 = {};
let PUBLIC_META = null;
fetch('data/countries.json').then(r => r.ok ? r.json() : null).then(j => {
  if(!j || !j.countries) return;
  PUBLIC_META = j._meta;
  Object.values(j.countries).forEach(e => { if(e.iso3) PUBLIC_BY_ISO3[e.iso3] = e; });
}).catch(() => {});

function pubLabel(x){ if(!x) return ''; if(typeof x === 'string') return x; return x[currentLang] || x.en || x.ko || x.ja || ''; }
function pubList(arr){ return (arr || []).map(x => x[currentLang] || x.en || x.ko || x.ja || '').filter(Boolean); }
function pubPop(n){
  if(!n) return '';
  if(currentLang === 'en') return n.toLocaleString('en-US');
  const u8 = currentLang === 'ja' ? '億' : '억', u4 = currentLang === 'ja' ? '万' : '만';
  if(n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + u8;
  if(n >= 1e4) return Math.round(n / 1e4).toLocaleString() + u4;
  return n.toLocaleString();
}
function pubEsc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pubSrcTitle(e, field){
  const list = (e.sources || {})[field];
  if(!list || !list.length) return '';
  return list.map(s => `${s.source} (${s.retrieved})`).join(', ');
}
// Cards for one country: [{icon,label,value,field}] in the current UI language
function buildPublicCards(iso){
  const e = PUBLIC_BY_ISO3[iso];
  if(!e) return [];
  const L = (ko, en, ja) => currentLang === 'en' ? en : currentLang === 'ja' ? ja : ko;
  const cards = [];
  if(e.capital) cards.push({icon:'🏛️', field:'capital', label:L('수도','Capital','首都'), value:pubEsc(pubLabel(e.capital))});
  if(e.population) cards.push({icon:'👥', field:'population', label:L('인구','Population','人口'), value:`${pubPop(e.population.value)} <span style="color:#777">(${e.population.as_of || ''})</span>`});
  if(e.currency && e.currency.length) cards.push({icon:'💱', field:'currency', label:L('통화','Currency','通貨'), value:pubEsc(pubList(e.currency).join(', '))});
  const gov = [];
  if(e.government_form && e.government_form.length) gov.push(pubEsc(pubList(e.government_form).join(', ')));
  if(e.government_type) gov.push(`<span style="color:#999">Factbook: ${pubEsc(e.government_type)}</span>`);
  if(gov.length) cards.push({icon:'🏛️', field:e.government_form ? 'government_form' : 'government_type', label:L('정부 형태','Form of government','政体'), value:gov.join('<br>')});
  if(e.head_of_state && e.head_of_state.length) cards.push({icon:'👑', field:'head_of_state', label:L('국가원수','Head of state','国家元首'), value:pubEsc(pubList(e.head_of_state).join(', '))});
  if(e.head_of_government && e.head_of_government.length) cards.push({icon:'👤', field:'head_of_government', label:L('정부수반','Head of government','政府首脳'), value:pubEsc(pubList(e.head_of_government).join(', '))});
  if(e.official_languages && e.official_languages.length){
    const langs = e.official_languages.map(x => {
      const n = x[currentLang] || x.en || '';
      return x.native && x.native !== n ? `${n} (${x.native})` : n;
    }).filter(Boolean);
    const shown = langs.slice(0, 6).map(pubEsc).join(', ') + (langs.length > 6 ? ` <span style="color:#777">+${langs.length - 6}</span>` : '');
    cards.push({icon:'🗣️', field:'official_languages', label:L('공용어','Official languages','公用語'), value:shown});
  }
  if(e.religions_text) cards.push({icon:'🙏', field:'religions_text', label:L('종교 구성','Religions','宗教構成'), value:pubEsc(e.religions_text)});
  if(e.ethnic_groups_text) cards.push({icon:'🧑‍🤝‍🧑', field:'ethnic_groups_text', label:L('민족 구성','Ethnic groups','民族構成'), value:pubEsc(e.ethnic_groups_text)});
  if(e.languages_text) cards.push({icon:'💬', field:'languages_text', label:L('사용 언어','Languages','言語'), value:pubEsc(e.languages_text)});
  if(e.legal_system) cards.push({icon:'⚖️', field:'legal_system', label:L('법체계','Legal system','法体系'), value:pubEsc(e.legal_system)});
  return cards;
}
// "Sources" line: distinct sources used for this country, with retrieval dates
function buildSourcesHTML(iso){
  const e = PUBLIC_BY_ISO3[iso];
  if(!e || !e.sources) return '';
  const seen = new Map();
  Object.values(e.sources).forEach(list => (list || []).forEach(s => { if(!seen.has(s.source)) seen.set(s.source, s); }));
  if(!seen.size) return '';
  const label = currentLang === 'en' ? 'Sources' : currentLang === 'ja' ? '出典' : '출처';
  const items = [...seen.values()].map(s => `<a href="${pubEsc(s.url)}" target="_blank" rel="noopener">${pubEsc(s.source)}</a> <span style="color:#555">${s.retrieved}</span>`);
  const wd = e.qid ? ` · <a href="https://www.wikidata.org/wiki/${e.qid}" target="_blank" rel="noopener">${e.qid}</a>` : '';
  return `<div class="pub-sources">${label}: ${items.join(' · ')}${wd}</div>`;
}
function buildPublicPanelHTML(iso){
  const cards = buildPublicCards(iso);
  if(!cards.length) return '';
  const title = currentLang === 'en' ? 'Public data' : currentLang === 'ja' ? '公開データ' : '공공 데이터';
  let html = `<div class="panel-section"><h3>🌐 ${title}</h3><div class="info-grid">`;
  cards.forEach(c => {
    const wide = c.value.length > 40 ? ' style="grid-column:1/-1"' : '';
    html += `<div class="info-item"${wide} title="${pubEsc(pubSrcTitle(PUBLIC_BY_ISO3[iso], c.field))}"><div class="info-label">${c.icon} ${c.label}</div><div class="pub-value">${c.value}</div></div>`;
  });
  html += `</div>${buildSourcesHTML(iso)}</div>`;
  return html;
}

// ── Deeplink: receive URL parameters ──
function handleDeeplink() {
  const params = new URLSearchParams(window.location.search);
  const countryISO = params.get('country');
  const tab = params.get('tab');
  if (!countryISO) return;
  
  // Wait for map to load
  const tryOpen = () => {
    const el = document.querySelector(`[data-iso="${countryISO}"]`);
    if (!el) { setTimeout(tryOpen, 300); return; }
    
    // Switch tab if specified
    if (tab && ['religion','food','politics','movies','languages','business'].includes(tab)) {
      switchTab(tab);
    }
    
    // Open panel
    setTimeout(() => {
      if (hasData(countryISO)) {
        openPanel(countryISO, el);
        // Switch panel inner tab
        if (tab) {
          setTimeout(() => {
            const tabBtn = document.querySelector(`.panel-tab-btn[data-ptab="${tab}"]`);
            if (tabBtn) tabBtn.click();
          }, 200);
        }
        // Highlight with glow
        el.style.filter = 'brightness(2) drop-shadow(0 0 8px #6c63ff)';
        setTimeout(() => { el.style.filter = ''; }, 2500);
      }
    }, 200);
  };
  setTimeout(tryOpen, 500);
}
window.addEventListener('load', handleDeeplink);

  html += `<div class="cp-cards-grid">`;
  overviewCards.forEach(c => {
    html += `<div class="cp-card"><div class="cp-card-sub">${c.icon} ${c.label}</div><div class="cp-card-title" style="margin-top:4px">${c.value}</div></div>`;
  });
  html += `</div></div>`;
  
  // Regions section
  if(rd) {
    html += `<div class="cp-section" id="cp-regions"><div class="cp-section-title">🗺️ ${currentLang==='en'?'Regions & Cities':currentLang==='ja'?'地域と都市':'지역 & 도시'}</div>`;
    html += `<div class="cp-region-map" id="cp-region-map-container"></div>`;
    html += `<div class="cp-cards-grid" style="margin-top:16px">`;
    rd.regions.forEach(r => {
      const rname = currentLang==='en'?r.en:(currentLang==='ja'?r.ja:r.name);
      const typeLabel = r.type==='capital'?(currentLang==='en'?'Capital':currentLang==='ja'?'首都':'수도'):(r.type==='city'?(currentLang==='en'?'City':currentLang==='ja'?'都市':'도시'):(currentLang==='en'?'Region':currentLang==='ja'?'地域':'지역'));
      html += `<div class="cp-card"><div class="cp-card-title">${r.icon} ${rname}</div><div class="cp-card-sub">${typeLabel}</div><div class="cp-card-desc">${r.desc}</div></div>`;
    });
    html += `</div></div>`;
  }
  
  // Religion section
  if(info) {
    html += `<div class="cp-section" id="cp-religion"><div class="cp-section-title">🙏 ${currentLang==='en'?'Religion':currentLang==='ja'?'宗教':'종교'}</div>`;
    const sorted = [...info.r].sort((a,b)=>b.p-a.p);
    const donutSvg = buildDonutSVG(sorted, 180, 72, 46);
    html += `<div class="cp-donut-wrap">${donutSvg}<div style="flex:1;min-width:200px">`;
    sorted.forEach(rel => {
      const rm = rc(rel.n);
      html += `<div class="p-hbar"><div class="p-hbar-label"><span><span class="p-hbar-icon">${rm.icon}</span> ${rn(rel.n)}</span><span>${rel.p}%</span></div><div class="p-hbar-track"><div class="p-hbar-fill" style="width:${rel.p}%;background:${rm.c}"></div></div></div>`;
    });
    html += `</div></div>`;
    if(prof) {
      const rfMap = {free:{t:t('rfFree'),cls:'tag-free'},partial:{t:t('rfPartial'),cls:'tag-partial'},restricted:{t:t('rfRestricted'),cls:'tag-restricted'}};
      const rf = rfMap[prof.rf]||rfMap.free;
      html += `<div style="margin-top:16px"><span class="tag ${rf.cls}">${rf.t}</span>`;
      if(prof.sr) html += `<span class="tag tag-state">${t('stateReligion')} ${prof.sr}</span>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  
  // Politics section
  if(pd) {
    const gt = GOV_TYPES[pd.gov]||{icon:'🏛️',c:'#666',en:pd.gov,ja:pd.gov};
    const govLabel = currentLang==='ko'?pd.gov:(currentLang==='ja'?(gt.ja||pd.gov):(gt.en||pd.gov));
    html += `<div class="cp-section" id="cp-politics"><div class="cp-section-title">🏛️ ${currentLang==='en'?'Politics':currentLang==='ja'?'政治':'정치'}</div>`;
    html += `<div class="info-grid" style="max-width:500px">`;
    html += `<div class="info-item" style="grid-column:1/-1"><div class="info-label">${t('pol_govType')}</div><div class="info-value">${gt.icon} ${govLabel}</div></div>`;
    const wl = pd.wiki ? ` <a href="${pd.wiki}" target="_blank" rel="noopener" style="text-decoration:none" title="Wikipedia">🔗</a>` : '';
    html += `<div class="info-item" style="grid-column:1/-1"><div class="info-label">${t('pol_leaderLabel')}</div><div class="info-value" style="font-size:13px">${pd.leader}${wl}</div></div>`;
    html += `</div>`;
    html += `<div style="margin-top:14px"><div class="info-label" style="margin-bottom:8px">${t('pol_partiesLabel')}</div>`;
    pd.parties.forEach(p => html += `<span class="party-tag">${p}</span>`);
    html += `</div></div>`;
  }
  
  // Food section
  if(fd) {
    html += `<div class="cp-section" id="cp-food"><div class="cp-section-title">🍜 ${currentLang==='en'?'Food':currentLang==='ja'?'料理':'음식'}</div>`;
    html += `<div class="cp-cards-grid">`;
    fd.dishes.forEach(d => {
      const dn = currentLang==='en'?d.en:(currentLang==='ja'?d.ja:d.ko);
      const enN = currentLang==='en'?'':d.en;
      const menuLink = `<a href="${DEEPLINK_URLS.menuLiteracy}?food=${encodeURIComponent(d.en)}" style="text-decoration:none;color:#6c63ff;font-size:11px;margin-left:6px" title="Menu Literacy">📖</a>`;
      html += `<div class="cp-card"><div class="cp-card-title">${dn}${menuLink}</div>${enN?`<div class="cp-card-sub">${enN}</div>`:''}
        <div class="cp-card-desc">${d.desc}</div><div class="cp-card-tag">🍴 ${d.flavor}</div></div>`;
    });
    html += `</div></div>`;
  }
  
  // Movies section
  if(md) {
    const mi = MOVIE_INDUSTRY[md.industry]||{en:md.industry,ja:md.industry};
    const indLabel = currentLang==='ko'?md.industry:(currentLang==='ja'?(mi.ja||md.industry):(mi.en||md.industry));
    html += `<div class="cp-section" id="cp-movies"><div class="cp-section-title">🎬 ${currentLang==='en'?'Movies':currentLang==='ja'?'映画':'영화'} · ${indLabel}</div>`;
    html += `<div class="religion-desc" style="margin-bottom:16px">${md.desc}</div>`;
    html += `<div class="cp-cards-grid">`;
    md.movies.forEach(m => {
      const mn = currentLang==='en'?m.en:(currentLang==='ja'?m.ja:m.ko);
      const enN = currentLang==='en'?'':m.en;
      const movieLink = `<a href="${DEEPLINK_URLS.moviePortal}?movie=${encodeURIComponent(m.ko)}" style="text-decoration:none;color:#a29bfe;font-size:11px;margin-left:6px" title="Movie Portal">🎬</a>`;
      html += `<div class="cp-card"><div class="cp-card-title">${mn}${movieLink}</div>${enN?`<div class="cp-card-sub">${enN}</div>`:''}
        <div class="cp-card-desc">📅 ${m.year} · 🎬 ${m.director}</div></div>`;
    });
    html += `</div></div>`;
  }
  
  // Business section
  if(bd) {
    const bi = BIZ_INDUSTRIES[bd.industry]||{icon:'🏢',en:bd.industry,ja:bd.industry};
    const indLabel = currentLang==='ko'?bd.industry:(currentLang==='ja'?(bi.ja||bd.industry):(bi.en||bd.industry));
    html += `<div class="cp-section" id="cp-business"><div class="cp-section-title">💼 ${currentLang==='en'?'Business':currentLang==='ja'?'ビジネス':'비즈니스'} · ${bi.icon} ${indLabel}</div>`;
    html += `<div class="cp-cards-grid">`;
    bd.companies.forEach(c => {
      const cn = currentLang==='en'?c.en:(currentLang==='ja'?c.ja:c.ko);
      const enN = currentLang==='en'?'':c.en;
      const ci = BIZ_INDUSTRIES[c.industry]||{icon:'🏢'};
      const wl = c.wiki ? ` <a href="${c.wiki}" target="_blank" rel="noopener" style="text-decoration:none;font-size:12px">🔗</a>` : '';
      html += `<div class="cp-card"><div class="cp-card-title">${cn}${wl}</div>${enN?`<div class="cp-card-sub">${enN}</div>`:''}
        <div class="cp-card-desc">${c.desc}</div><div class="cp-card-tag">${ci.icon} ${currentLang==='ko'?c.industry:(currentLang==='ja'?(ci.ja||c.industry):(ci.en||c.industry))}</div></div>`;
    });
    html += `</div></div>`;
  }
  
  // Languages section
  if(ld) {
    const lf = LANG_FAMILIES[ld.family]||{icon:'🌐',en:ld.family,ja:ld.family};
    const famLabel = currentLang==='ko'?ld.family:(currentLang==='ja'?(lf.ja||ld.family):(lf.en||ld.family));
    html += `<div class="cp-section" id="cp-languages"><div class="cp-section-title">🗣️ ${currentLang==='en'?'Language':currentLang==='ja'?'言語':'언어'}</div>`;
    html += `<div class="lang-greeting" style="font-size:32px">${ld.greeting}</div>`;
    html += `<div class="info-grid" style="max-width:500px;margin-top:16px">`;
    html += `<div class="info-item"><div class="info-label">${t('lang_officialLabel')}</div><div class="info-value">${ld.official}</div></div>`;
    html += `<div class="info-item"><div class="info-label">${t('lang_familyLabel')}</div><div class="info-value">${lf.icon} ${famLabel}</div></div>`;
    html += `</div>`;
    html += `<div style="margin-top:14px"><div class="info-label" style="margin-bottom:8px">${t('lang_otherLangs')}</div><div class="lang-list">`;
    ld.languages.forEach(l => html += `<span class="lang-tag">${l}</span>`);
    html += `</div></div></div>`;
  }
  
  // Public data section (Wikidata + CIA World Factbook), with a Sources line
  if(pub) {
    const cards = buildPublicCards(iso);
    html += `<div class="cp-section" id="cp-public"><div class="cp-section-title">🌐 ${currentLang==='en'?'Public data':currentLang==='ja'?'公開データ':'공공 데이터'}</div>`;
    html += `<div class="cp-cards-grid">`;
    cards.forEach(c => {
      html += `<div class="cp-card" title="${pubEsc(pubSrcTitle(pub, c.field))}"><div class="cp-card-sub">${c.icon} ${c.label}</div><div class="pub-value" style="margin-top:4px;font-size:13px">${c.value}</div></div>`;
    });
    html += `</div>${buildSourcesHTML(iso)}</div>`;
  }
  
  html += `</div>`; // close cp-content
  
  countryPage.innerHTML = html;
  countryPage.scrollTop = 0;
  requestAnimationFrame(() => countryPage.classList.add('open'));
  
  // Update hash
  history.pushState({iso}, '', `#country/${iso}`);
  
  // Render region map if exists
  if(rd) setTimeout(() => renderRegionMap(iso, rd), 100);
}

function closeCountryPage() {
  countryPage.classList.remove('open');
  countryPageOpen = false;
  if(location.hash.startsWith('#country/')) history.pushState({}, '', location.pathname + location.search);
}

function cpScrollTo(id) {
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  // Update active nav
  document.querySelectorAll('.cp-nav-btn').forEach(b => b.classList.remove('active'));
  event?.target?.classList?.add('active');
}

// Intersection observer for nav highlighting
function setupNavObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting) {
        document.querySelectorAll('.cp-nav-btn').forEach(b => {
          b.classList.toggle('active', b.getAttribute('onclick')?.includes(e.target.id));
        });
      }
    });
  }, {threshold: 0.3, root: countryPage});
  countryPage.querySelectorAll('.cp-section').forEach(s => observer.observe(s));
}

// Region map renderer
function renderRegionMap(iso, rd) {
  const container = document.getElementById('cp-region-map-container');
  if(!container) return;
  
  const width = container.clientWidth || 500;
  const height = Math.min(width * 0.7, 400);
  const padding = 30;

  // Find country feature from global data
  let countryFeature = null;
  if(globalCountries) {
    countryFeature = globalCountries.features.find(f => {
      const fiso = idToISO[f.id] || (f.properties && f.properties.ISO_A3);
      return fiso === iso;
    });
  }

  // Create SVG element with d3
  container.innerHTML = '';
  const svgEl = d3.select(container).append('svg')
    .attr('width', width).attr('height', height)
    .attr('viewBox', `0 0 ${width} ${height}`);

  // Background
  svgEl.append('rect').attr('width', width).attr('height', height)
    .attr('fill', 'rgba(255,255,255,.02)').attr('rx', 16);

  if(countryFeature) {
    // Use d3 projection fitted to country shape
    const projection = d3.geoMercator()
      .fitExtent([[padding, padding], [width - padding, height - padding]], countryFeature);
    const pathGen = d3.geoPath().projection(projection);

    // Draw country shape
    svgEl.append('path')
      .datum(countryFeature)
      .attr('d', pathGen)
      .attr('fill', 'rgba(74,144,217,.12)')
      .attr('stroke', 'rgba(74,144,217,.4)')
      .attr('stroke-width', 1.5);

    // Connection lines from capital
    const capital = rd.regions.find(r => r.type === 'capital');
    if(capital) {
      rd.regions.forEach(r => {
        if(r.type !== 'capital') {
          const [x1,y1] = projection([capital.lon, capital.lat]);
          const [x2,y2] = projection([r.lon, r.lat]);
          svgEl.append('line')
            .attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
            .attr('stroke','rgba(74,144,217,.15)').attr('stroke-width',1).attr('stroke-dasharray','3,3');
        }
      });
    }

    // Markers
    rd.regions.forEach((r, i) => {
      const [x, y] = projection([r.lon, r.lat]);
      const isCapital = r.type === 'capital';
      const radius = isCapital ? 8 : 6;
      const color = isCapital ? '#e74c3c' : (r.type==='city' ? '#3498db' : '#2ecc71');
      svgEl.append('circle').attr('cx',x).attr('cy',y).attr('r',radius)
        .attr('fill',color).attr('stroke','#fff').attr('stroke-width',1.5).attr('opacity',0.9);
      svgEl.append('text').attr('x',x).attr('y',y-12).attr('text-anchor','middle')
        .attr('fill','#fff').attr('font-size',16).text(r.icon);
      const rname = currentLang==='en'?r.en:(currentLang==='ja'?r.ja:r.name);
      svgEl.append('text').attr('x',x).attr('y',y+radius+14).attr('text-anchor','middle')
        .attr('fill','#ccc').attr('font-size',10).attr('font-weight',500).text(rname);
    });
  } else {
    // Fallback: use bounds-based rendering if no country feature found
    const bounds = rd.bounds;
    const latRange = bounds[1][0] - bounds[0][0];
    const lonRange = bounds[1][1] - bounds[0][1];
    function toX(lon) { return padding + (lon - bounds[0][1]) / lonRange * (width - 2*padding); }
    function toY(lat) { return padding + (bounds[1][0] - lat) / latRange * (height - 2*padding); }
    
    const capital = rd.regions.find(r => r.type === 'capital');
    if(capital) {
      rd.regions.forEach(r => {
        if(r.type !== 'capital') {
          svgEl.append('line').attr('x1',toX(capital.lon)).attr('y1',toY(capital.lat))
            .attr('x2',toX(r.lon)).attr('y2',toY(r.lat))
            .attr('stroke','rgba(74,144,217,.15)').attr('stroke-width',1).attr('stroke-dasharray','3,3');
        }
      });
    }
    rd.regions.forEach((r, i) => {
      const x = toX(r.lon), y = toY(r.lat);
      const isCapital = r.type === 'capital';
      const radius = isCapital ? 8 : 6;
      const color = isCapital ? '#e74c3c' : (r.type==='city' ? '#3498db' : '#2ecc71');
      svgEl.append('circle').attr('cx',x).attr('cy',y).attr('r',radius)
        .attr('fill',color).attr('stroke','#fff').attr('stroke-width',1.5).attr('opacity',0.9);
      svgEl.append('text').attr('x',x).attr('y',y-12).attr('text-anchor','middle')
        .attr('fill','#fff').attr('font-size',16).text(r.icon);
      const rname = currentLang==='en'?r.en:(currentLang==='ja'?r.ja:r.name);
      svgEl.append('text').attr('x',x).attr('y',y+radius+14).attr('text-anchor','middle')
        .attr('fill','#ccc').attr('font-size',10).attr('font-weight',500).text(rname);
    });
  }
}

// ── Double-click handler for map countries ──
let clickTimer = null;

function handleCountryInteraction(iso, el, isDoubleClick) {
  if(isDoubleClick) {
    if(clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    openCountryPage(iso);
  } else {
    clickTimer = setTimeout(() => {
      clickTimer = null;
      if(hasData(iso)) openPanel(iso, el);
    }, 250);
  }
}

// ── Hash routing ──
function handleHashRoute() {
  const hash = location.hash;
  if(hash.startsWith('#country/')) {
    const iso = hash.replace('#country/', '').split('/')[0];
    if(iso && hasData(iso)) {
      // Wait for map load
      const tryOpen = () => {
        if(document.querySelector('[data-iso]')) {
          openCountryPage(iso);
          // Check for section
          const section = hash.split('/')[2];
          if(section) setTimeout(() => cpScrollTo('cp-' + section), 500);
        } else setTimeout(tryOpen, 200);
      };
      setTimeout(tryOpen, 300);
    }
  }
}

window.addEventListener('popstate', (e) => {
  if(countryPageOpen) closeCountryPage();
  else if(e.state?.iso) openCountryPage(e.state.iso);
});

// ── Override deeplink handler to also support hash + full page ──
const _origHandleDeeplink = handleDeeplink;
window.removeEventListener('load', _origHandleDeeplink);

function handleDeeplinkV2() {
  const params = new URLSearchParams(window.location.search);
  const countryISO = params.get('country');
  const tab = params.get('tab');
  
  if(location.hash.startsWith('#country/')) {
    handleHashRoute();
    return;
  }
  
  if(!countryISO) return;
  
  const tryOpen = () => {
    const el = document.querySelector(`[data-iso="${countryISO}"]`);
    if(!el) { setTimeout(tryOpen, 300); return; }
    if(tab && tab !== 'public') switchTab(tab === 'food' ? 'food' : tab === 'movies' ? 'movies' : tab);
    setTimeout(() => {
      // If tab specified, open full page and scroll to section
      openCountryPage(countryISO);
      if(tab) {
        const sectionMap = {food:'cp-food',movies:'cp-movies',religion:'cp-religion',politics:'cp-politics',business:'cp-business',languages:'cp-languages',public:'cp-public'};
        const sid = sectionMap[tab];
        if(sid) setTimeout(() => cpScrollTo(sid), 500);
      }
    }, 300);
  };
  setTimeout(tryOpen, 500);
}
window.addEventListener('load', handleDeeplinkV2);

// Escape key
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    if(countryPageOpen) closeCountryPage();
    else closePanel();
  }
});

// Init
buildLegend();
buildStats();
applyLanguage(currentLang);
</script>
