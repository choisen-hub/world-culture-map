<html lang="ko">
<head>

<title>세계 문화 지도 🌍 3D Globe</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--catholic:#4a90d9;--protestant:#6ec6ff;--orthodox:#1e3a5f;
--sunni:#2ecc71;--shia:#1a8a4a;--ibadi:#0d6b3a;
--buddhism:#f1c40f;--hinduism:#e67e22;--judaism:#9b59b6;
--none:#95a5a6;--traditional:#e74c3c;--other:#7f8c8d;
--bg:#0a0a14;--surface:#0f0f1e;--surface2:#161628;--border:rgba(255,255,255,.08)
}
body{background:#000;color:#e0e0e0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:10px 16px 2px;flex-shrink:0;position:relative;z-index:10}
header h1{font-size:clamp(16px,3.5vw,26px);font-weight:600;letter-spacing:1px}
#globe-container{flex:1;position:relative;cursor:grab}
#globe-container:active{cursor:grabbing}
canvas{display:block}
#tooltip{position:absolute;pointer-events:none;background:rgba(10,10,20,.95);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;display:none;max-width:280px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:20}
.tt-name{font-size:15px;font-weight:600;margin-bottom:4px}
.tt-religion{color:#bbb;font-size:12px}
.tt-bar{height:6px;border-radius:3px;margin:2px 0;background:#222}
.tt-bar-fill{height:100%;border-radius:3px}
#legend{position:absolute;bottom:12px;left:12px;background:rgba(10,10,20,.9);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:11px;backdrop-filter:blur(12px);z-index:10;max-height:calc(100vh - 100px);overflow-y:auto}
#legend h3{font-size:12px;margin-bottom:8px;color:#888;font-weight:500}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0;white-space:nowrap}
.legend-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.legend-color{width:20px;height:10px;border-radius:3px;flex-shrink:0}
#view-toggle{position:absolute;top:12px;right:16px;z-index:10;background:rgba(15,15,30,.9);border:1px solid var(--border);border-radius:10px;padding:8px 16px;color:#e0e0e0;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
#view-toggle:hover{background:rgba(30,30,60,.9);border-color:rgba(255,255,255,.2)}
#lang-switcher{position:absolute;top:12px;left:16px;z-index:10;display:flex;gap:4px}
#lang-switcher button{background:rgba(15,15,30,.9);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:4px 8px;font-size:16px;cursor:pointer;transition:all .2s;color:#e0e0e0}
#lang-switcher button:hover{background:rgba(30,30,60,.9);border-color:rgba(255,255,255,.2)}
#lang-switcher button.active{background:rgba(74,144,217,.3);border-color:rgba(74,144,217,.5)}
/* Panel */
#panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
#panel-overlay.open{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;width:440px;max-width:100vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:51;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
#panel-close{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 14px;background:linear-gradient(var(--surface),transparent)}
#panel-close button{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#888;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
#panel-close button:hover{background:rgba(255,255,255,.12);color:#fff}
.panel-header{padding:0 24px 20px;text-align:center}
.panel-flag{font-size:56px;line-height:1;margin-bottom:4px}
.panel-country{font-size:24px;font-weight:700}
.panel-country-en{font-size:13px;color:#666;margin-top:2px}
.panel-section{padding:18px 24px;border-top:1px solid var(--border)}
.panel-section h3{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.info-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.info-value{font-size:13px;font-weight:500}
.panel-donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.panel-donut-svg{flex-shrink:0}
.panel-donut-legend{flex:1;font-size:12px}
.pdl-item{display:flex;align-items:center;gap:6px;margin:4px 0}
.pdl-icon{font-size:14px;width:18px;text-align:center}
.pdl-color{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pdl-pct{color:#777;margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}
.p-hbar{margin:5px 0}
.p-hbar-label{font-size:11px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.p-hbar-icon{font-size:13px}
.p-hbar-track{height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.p-hbar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.religion-desc{font-size:12px;color:#999;line-height:1.6;margin-top:10px;padding:12px 14px;background:rgba(255,255,255,.02);border-radius:10px;border-left:3px solid #444}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;margin:3px 3px 3px 0}
.tag-free{background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.25)}
.tag-partial{background:rgba(241,196,15,.12);color:#f1c40f;border:1px solid rgba(241,196,15,.25)}
.tag-restricted{background:rgba(231,76,60,.12);color:#e74c3c;border:1px solid rgba(231,76,60,.25)}
.tag-state{background:rgba(74,144,217,.12);color:#4a90d9;border:1px solid rgba(74,144,217,.25)}
footer{text-align:center;padding:5px;font-size:10px;color:#444;flex-shrink:0;position:relative;z-index:10}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;color:#888;z-index:5}
@media(max-width:600px){
  #legend{bottom:8px;left:6px;padding:8px 10px;font-size:9px;max-width:130px}
  .legend-icon{font-size:11px;width:14px}
  .legend-color{width:14px;height:8px}
  #tooltip{font-size:11px;max-width:200px}
  #panel{width:100vw;border-left:none}
  #view-toggle{padding:6px 12px;font-size:12px}
}
</style>

function buildDonutSVG(rels,size,outerR,innerR){
  let cum=-Math.PI/2,arcs='';
  rels.forEach(rel=>{
    const angle=(rel.p/100)*2*Math.PI;if(angle<0.01)return;
    const x1=Math.cos(cum)*outerR,y1=Math.sin(cum)*outerR;
    const ea=cum+angle;
    const x2=Math.cos(ea)*outerR,y2=Math.sin(ea)*outerR;
    const ix1=Math.cos(cum)*innerR,iy1=Math.sin(cum)*innerR;
    const ix2=Math.cos(ea)*innerR,iy2=Math.sin(ea)*innerR;
    const lg=angle>Math.PI?1:0;
    arcs+=`<path d="M${ix1},${iy1} L${x1},${y1} A${outerR},${outerR} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${innerR},${innerR} 0 ${lg} 0 ${ix1},${iy1}" fill="${rc(rel.n).c}" stroke="#0f0f1e" stroke-width="1.5"/>`;
    cum=ea;
  });
  const pad=outerR+6;
  const majorIcon=rc(rels[0].n).icon;
  return `<svg class="panel-donut-svg" width="${size}" height="${size}" viewBox="-${pad} -${pad} ${pad*2} ${pad*2}">${arcs}<text x="0" y="6" text-anchor="middle" font-size="24">${majorIcon}</text></svg>`;
}

function openPanel(iso){
  const info=DATA[iso];const prof=PROFILE[iso];
  if(!info)return;
  const rfMap={free:{t:t('rfFree'),cls:"tag-free"},partial:{t:t('rfPartial'),cls:"tag-partial"},restricted:{t:t('rfRestricted'),cls:"tag-restricted"}};
  const rf=prof?rfMap[prof.rf]||rfMap.free:rfMap.free;
  const sorted=[...info.r].sort((a,b)=>b.p-a.p);
  const donutSvg=buildDonutSVG(sorted,140,56,36);
  const donutLegend=sorted.map(rel=>`<div class="pdl-item"><span class="pdl-icon">${rc(rel.n).icon}</span><div class="pdl-color" style="background:${rc(rel.n).c}"></div><span>${rn(rel.n)}</span><span class="pdl-pct">${rel.p}%</span></div>`).join('');
  const bars=sorted.map(rel=>`<div class="p-hbar"><div class="p-hbar-label"><span><span class="p-hbar-icon">${rc(rel.n).icon}</span> ${rn(rel.n)}</span><span>${rel.p}%</span></div><div class="p-hbar-track"><div class="p-hbar-fill" style="width:${rel.p}%;background:${rc(rel.n).c}"></div></div></div>`).join('');
  let html=`<div class="panel-header"><div class="panel-flag">${prof?prof.f:'🏳️'}</div><div class="panel-country">${info.n}</div><div class="panel-country-en">${prof?prof.e:''}</div></div>`;
  if(prof){
    html+=`<div class="panel-section"><h3>${t('profileTitle')}</h3><div class="info-grid">
      <div class="info-item"><div class="info-label">${t('capital')}</div><div class="info-value">${prof.c}</div></div>

      <div class="info-item"><div class="info-label">${t('continent')}</div><div class="info-value">${prof.g}</div></div>
      <div class="info-item"><div class="info-label">${t('language')}</div><div class="info-value">${prof.l}</div></div>
    </div></div>`;
  }
  html+=`<div class="panel-section"><h3>${t('religionTitle')}</h3><div class="panel-donut-wrap">${donutSvg}<div class="panel-donut-legend">${donutLegend}</div></div>${bars}</div>`;
  html+=`<div class="panel-section"><h3>${t('envTitle')}</h3><div style="margin-bottom:8px"><span class="tag ${rf.cls}">${rf.t}</span>`;
  if(prof&&prof.sr)html+=`<span class="tag tag-state">${t('stateReligion')} ${prof.sr}</span>`;
  html+=`</div>`;
  if(prof&&prof.desc)html+=`<div class="religion-desc">${prof.desc}</div>`;
  html+=`</div>`;
  panelContent.innerHTML=html;
  panel.classList.add('open');panelOverlay.classList.add('open');
}

const container=document.getElementById('globe-container');
const W=()=>container.clientWidth, H=()=>container.clientHeight;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,W()/H(),0.1,1000);
camera.position.z=2.8;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});

container.insertBefore(renderer.domElement,container.firstChild);

// Stars
const starGeo=new THREE.BufferGeometry();
const starVerts=[];
for(let i=0;i<6000;i++){
  const r=100+Math.random()*400;
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  starVerts.push(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi));
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starVerts,3));
const starMat=new THREE.PointsMaterial({color:0xffffff,size:0.3,sizeAttenuation:true});
scene.add(new THREE.Points(starGeo,starMat));

// Globe sphere (placeholder until texture ready)
const GLOBE_R=1;
const globeGeo=new THREE.SphereGeometry(GLOBE_R,128,128);
const globeMat=new THREE.MeshPhongMaterial({color:0x111122,transparent:false});
const globe=new THREE.Mesh(globeGeo,globeMat);

// Atmosphere glow
const glowGeo=new THREE.SphereGeometry(GLOBE_R*1.02,64,64);
const glowMat=new THREE.ShaderMaterial({
  vertexShader:`varying vec3 vNormal;void main(){vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying vec3 vNormal;void main(){float intensity=pow(0.65-dot(vNormal,vec3(0,0,1.0)),2.5);gl_FragColor=vec4(0.3,0.6,1.0,1.0)*intensity;}`,
  blending:THREE.AdditiveBlending,
  side:THREE.BackSide,
  transparent:true
});
scene.add(new THREE.Mesh(glowGeo,glowMat));

// Country data for raycasting
let countryFeatures=[];
let countryISOs=[];

// Load TopoJSON and paint texture
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
.then(r=>r.json())
.then(world=>{
  const countries=topojson.feature(world,world.objects.countries);
  countryFeatures=countries.features;
  countryISOs=countries.features.map(f=>idToISO[f.id]||'');

  // Draw on canvas
  const texW=4096,texH=2048;
  const canvas=document.createElement('canvas');
  canvas.width=texW;canvas.height=texH;
  const ctx=canvas.getContext('2d');

  // Ocean
  ctx.fillStyle='#0a0a1e';
  ctx.fillRect(0,0,texW,texH);

  // Equirectangular projection
  const proj=d3.geoEquirectangular().fitSize([texW,texH],{type:"Sphere"});
  const pathGen=d3.geoPath(proj,ctx);

  // Fill countries
  countries.features.forEach(f=>{
    const iso=idToISO[f.id]||'';
    const d=DATA[iso];
    let col='#1a1a2e';
    if(d&&d.r&&d.r.length){col=rc(d.r[0].n).c;}
    ctx.beginPath();
    pathGen(f);
    ctx.fillStyle=col;
    ctx.fill();
  });

  // Borders
  const mesh=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);
  ctx.beginPath();
  pathGen(mesh);
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1;
  ctx.stroke();

  // Apply texture
  const tex=new THREE.CanvasTexture(canvas);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  globeMat.map=tex;
  globeMat.color.set(0xffffff);
  globeMat.needsUpdate=true;

  document.getElementById('loading').style.display='none';
});

// ── Interaction ──
let isDragging=false, prevMouse={x:0,y:0};
let autoRotate=true, autoRotateSpeed=0.002;
let targetRotY=0, targetRotX=0;
let momentumX=0, momentumY=0;
let zoomTarget=2.8;
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let hoveredISO=null;
let dragDist=0;

function onPointerDown(e){
  isDragging=true;dragDist=0;
  autoRotate=false;
  const p=e.touches?e.touches[0]:e;
  prevMouse={x:p.clientX,y:p.clientY};
  momentumX=0;momentumY=0;
}
function onPointerMove(e){
  const p=e.touches?e.touches[0]:e;
  if(isDragging){
    const dx=p.clientX-prevMouse.x;
    const dy=p.clientY-prevMouse.y;
    dragDist+=Math.abs(dx)+Math.abs(dy);
    globe.rotation.y+=dx*0.005;
    globe.rotation.x+=dy*0.005;
    globe.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,globe.rotation.x));
    momentumX=dx*0.005;momentumY=dy*0.005;
    prevMouse={x:p.clientX,y:p.clientY};
  }
  // Hover
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((p.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((p.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObject(globe);
  if(hits.length>0&&countryFeatures.length>0){
    const uv=hits[0].uv;
    const lon=(uv.x*360-180);
    const lat=(90-uv.y*180);
    const pt=[lon,lat];
    let foundISO=null;
    for(let i=0;i<countryFeatures.length;i++){
      if(d3.geoContains(countryFeatures[i],pt)){
        foundISO=countryISOs[i];break;
      }
    }
    if(foundISO&&DATA[foundISO]){
      hoveredISO=foundISO;
      const info=DATA[foundISO];
      let html=`<div class="tt-name">${info.n}</div>`;
      info.r.forEach(r=>{
        html+=`<div class="tt-religion"><span style="color:${rc(r.n).c}">${rc(r.n).icon}</span> ${rn(r.n)}: ${r.p}%</div>`;
        html+=`<div class="tt-bar"><div class="tt-bar-fill" style="width:${r.p}%;background:${rc(r.n).c}"></div></div>`;
      });
      tooltip.innerHTML=html;tooltip.style.display='block';
      let tx=p.clientX-container.getBoundingClientRect().left+15;
      let ty=p.clientY-container.getBoundingClientRect().top+15;
      if(tx+280>W())tx-=300;
      if(ty+200>H())ty-=220;
      tooltip.style.left=tx+'px';tooltip.style.top=ty+'px';
      container.style.cursor='pointer';
    } else {
      hoveredISO=null;tooltip.style.display='none';container.style.cursor='grab';
    }
  } else {
    hoveredISO=null;tooltip.style.display='none';container.style.cursor='grab';
  }
}
function onPointerUp(e){
  if(isDragging&&dragDist<5&&hoveredISO){
    openPanel(hoveredISO);
  }
  isDragging=false;
  // Resume autorotate after 3s
  setTimeout(()=>{if(!isDragging)autoRotate=true;},3000);
}
function onWheel(e){
  e.preventDefault();
  zoomTarget+=e.deltaY*0.001;
  zoomTarget=Math.max(1.5,Math.min(6,zoomTarget));
}

renderer.domElement.addEventListener('mousedown',onPointerDown);
renderer.domElement.addEventListener('mousemove',onPointerMove);
renderer.domElement.addEventListener('mouseup',onPointerUp);
renderer.domElement.addEventListener('mouseleave',()=>{isDragging=false;tooltip.style.display='none';});
renderer.domElement.addEventListener('wheel',onWheel,{passive:false});
renderer.domElement.addEventListener('touchstart',onPointerDown,{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();onPointerMove(e);},{passive:false});
renderer.domElement.addEventListener('touchend',onPointerUp);

// Animate
function animate(){
  requestAnimationFrame(animate);
  if(autoRotate){
    globe.rotation.y+=autoRotateSpeed;
  } else if(!isDragging){
    globe.rotation.y+=momentumX;
    globe.rotation.x+=momentumY;
    globe.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,globe.rotation.x));
    momentumX*=0.95;momentumY*=0.95;
  }
  camera.position.z+=(zoomTarget-camera.position.z)*0.1;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

// ── Language switching ──
function applyLanguage(lang){
  currentLang=lang;
  localStorage.setItem('religion-map-lang',lang);
  document.querySelectorAll('#lang-switcher button').forEach(b=>{
    b.classList.toggle('active',b.dataset.lang===lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(i18n[lang]&&i18n[lang][key])el.textContent=i18n[lang][key];
  });
  buildLegend();
  closePanel();
}
document.querySelectorAll('#lang-switcher button').forEach(btn=>{
  btn.addEventListener('click',()=>applyLanguage(btn.dataset.lang));
});
applyLanguage(currentLang);
</script>
